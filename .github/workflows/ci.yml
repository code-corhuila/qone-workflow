name: CI
on:
  pull_request:
    branches: [develop, qa, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Domain, orchestrator, participants, HTTP, contract, architecture and Redis tests
        run: python -m pytest
        env:
          TEST_REDIS_URL: redis://localhost:6379/0

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -f deploy/Dockerfile -t qone-workflow:ci .
      - name: Run it with Redis and a throwaway key, then smoke-check it
        run: |
          docker network create ci
          docker run -d --rm --name redis --network ci redis:7.4-alpine
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /tmp/jwt-private.pem 2>/dev/null
          openssl pkey -in /tmp/jwt-private.pem -pubout -out /tmp/jwt-public.pem
          docker run -d --rm --name workflow-ci --network ci -p 8012:8000 -e REDIS_URL=redis://redis:6379/0 -e SERVICE_TOKEN=ci-token \
            -e JWT_PUBLIC_KEY="$(awk 'NF {printf "%s\\n", $0}' /tmp/jwt-public.pem)" qone-workflow:ci
          for i in $(seq 1 30); do curl -fs http://localhost:8012/api/v1/sagas/health && break; sleep 1; done
          sh deploy/smoke.sh http://localhost:8012
          docker stop workflow-ci redis
